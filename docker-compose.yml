# Run locally:  docker compose up --build   ->  http://localhost:5000
# The Gemini key is read from your shell or from a .env file next to this one.
# It is passed in when the container starts, never copied into the image.
# Without a key the app runs rules-only.
services:
  app:
    build: .
    ports:
      - "5000:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      REVIEWS_PATH: /app/state/reviews.json
    volumes:
      - reviewer-state:/app/state    # keeps reviewer decisions across restarts

volumes:
  reviewer-state:
