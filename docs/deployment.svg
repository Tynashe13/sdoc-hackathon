<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'><title>deployment.svg</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');</style><defs><marker id="h-0a5fd6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a5fd6"/></marker><marker id="h-1c1c1e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1c1e"/></marker><marker id="h-7d3cc8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d3cc8"/></marker><marker id="h-5b5b61" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b61"/></marker><marker id="h-6e6e73" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker><marker id="h-b85c00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85c00"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="62.0" font-size="34" font-weight="700" fill="#1c1c1e" text-anchor="start">Where it runs</text><text x="40" y="94.0" font-size="18" font-weight="400" fill="#5b5b61" text-anchor="start">One Python function on Vercel serves the page and the API. Decisions live in Supabase.</text><rect x="40" y="170" width="240" height="110" rx="14" fill="#f0f0f3" stroke="#6e6e73" stroke-width="2"/><text x="160" y="205.0" font-size="20" font-weight="700" fill="#1c1c1e" text-anchor="middle">GitHub</text><text x="160" y="232.0" font-size="14.5" font-weight="400" fill="#5b5b61" text-anchor="middle">the team's repository</text><text x="160" y="254.0" font-size="14.5" font-weight="500" fill="#1c1c1e" text-anchor="middle">main branch</text><rect x="40" y="470" width="240" height="130" rx="14" fill="#f0f0f3" stroke="#6e6e73" stroke-width="2"/><text x="160" y="505.0" font-size="20" font-weight="700" fill="#1c1c1e" text-anchor="middle">Browser</text><text x="160" y="532.0" font-size="14.5" font-weight="400" fill="#5b5b61" text-anchor="middle">a judge's phone or laptop</text><text x="160" y="556.0" font-size="14.5" font-weight="500" fill="#1c1c1e" text-anchor="middle">the live link, no install</text><rect x="400" y="150" width="720" height="520" rx="14" fill="#eaf2ff" stroke="#0a5fd6" stroke-width="2.5"/><text x="424" y="188.0" font-size="24" font-weight="700" fill="#0a5fd6" text-anchor="start">Vercel</text><text x="1100" y="188.0" font-size="15" font-weight="500" fill="#0a5fd6" text-anchor="end">Python function, HTTPS</text><rect x="424" y="215" width="672" height="96" rx="10" fill="#ffffff" stroke="#0a5fd6" stroke-width="1.5"/><text x="444" y="245.0" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="start">Web page</text><text x="444" y="271.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">static/index.html: inbox, comparison table with source quotes, review form, CSV</text><text x="444" y="290.1" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">export.</text><rect x="424" y="327" width="672" height="116" rx="10" fill="#ffffff" stroke="#0a5fd6" stroke-width="1.5"/><text x="444" y="357.0" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="start">Flask API (app.py)</text><text x="444" y="383.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">/api/emails, /api/emails/{id}, recheck, resolve, retry, undo, /api/report.csv and</text><text x="444" y="402.1" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">/healthz.</text><rect x="424" y="459" width="672" height="96" rx="10" fill="#ffffff" stroke="#0a5fd6" stroke-width="1.5"/><text x="444" y="489.0" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="start">Checking code</text><text x="444" y="515.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">classify, readers, extract, compare, pipeline: the same rules-only code that</text><text x="444" y="534.1" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">produced the verdicts.</text><rect x="424" y="571" width="672" height="82" rx="10" fill="#ffffff" stroke="#0a5fd6" stroke-width="1.5"/><text x="444" y="601.0" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="start">results.json</text><text x="444" y="627.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">The 520 precomputed verdicts, with a fingerprint of the data and the code.</text><rect x="1290" y="170" width="270" height="170" rx="14" fill="#fff3e0" stroke="#b85c00" stroke-width="2"/><text x="1310" y="204.0" font-size="20" font-weight="700" fill="#b85c00" text-anchor="start">Supabase</text><text x="1310" y="232.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">Postgres table 'reviews', one</text><text x="1310" y="250.5" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">row per decision. Row-level</text><text x="1310" y="269.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">security is on; only the server</text><text x="1310" y="287.4" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">holds the key.</text><rect x="1290" y="440" width="270" height="150" rx="14" fill="#f5eeff" stroke="#7d3cc8" stroke-width="2" stroke-dasharray='8 6'/><text x="1310" y="474.0" font-size="20" font-weight="700" fill="#7d3cc8" text-anchor="start">Gemini API</text><text x="1310" y="502.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">Optional. Used only when a key</text><text x="1310" y="520.5" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">is set in Vercel's environment</text><text x="1310" y="539.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">variables.</text><path d="M160,282 L160,330 L398,330" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><text x="176" y="300.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">push to main:</text><text x="176" y="319.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">build and deploy</text><text x="176" y="358.0" font-size="13.5" font-weight="400" fill="#5b5b61" text-anchor="start">other branches get</text><text x="176" y="376.0" font-size="13.5" font-weight="400" fill="#5b5b61" text-anchor="start">a private preview</text><path d="M282,535 L398,535" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><path d="M398,555 L282,555" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><text x="340" y="588.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="middle">HTTPS</text><path d="M1122,265 L1288,265" fill="none" stroke="#b85c00" stroke-width="2.5" marker-end='url(#h-b85c00)'/><path d="M1288,290 L1122,290" fill="none" stroke="#b85c00" stroke-width="2.5" marker-end='url(#h-b85c00)'/><text x="1205" y="250.0" font-size="13.5" font-weight="700" fill="#b85c00" text-anchor="middle">REST</text><path d="M1122,515 L1288,515" fill="none" stroke="#7d3cc8" stroke-width="2.5" stroke-dasharray='7 6' marker-end='url(#h-7d3cc8)'/><text x="1205" y="500.0" font-size="13.5" font-weight="700" fill="#7d3cc8" text-anchor="middle">if a key is set</text><rect x="40" y="730" width="1520" height="128" rx="14" fill="#f7f7f9" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="762.0" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="start">Start-up</text><text x="60" y="788.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">A fingerprint (SHA-256 of the inbox files and the checking code) is compared with results.json. If it matches, the app is ready in about a second. If not, the verdicts are recomputed in the</text><text x="60" y="807.1" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">background and the page shows progress. A stale snapshot is never used.</text></svg>