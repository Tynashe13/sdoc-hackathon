<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family='-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'><title>architecture.svg</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');</style><defs><marker id="h-7d3cc8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d3cc8"/></marker><marker id="h-0a5fd6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a5fd6"/></marker><marker id="h-6e6e73" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker><marker id="h-1c1c1e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1c1e"/></marker><marker id="h-5b5b61" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b61"/></marker><marker id="h-b85c00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85c00"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="40" y="62.0" font-size="34" font-weight="700" fill="#1c1c1e" text-anchor="start">SDOC Check: from an email to a verdict</text><text x="40" y="94.0" font-size="18" font-weight="400" fill="#5b5b61" text-anchor="start">Rules decide. AI only helps where rules cannot, and a person settles anything uncertain.</text><rect x="40" y="150" width="160" height="196" rx="14" fill="#f0f0f3" stroke="#6e6e73" stroke-width="2"/><text x="120" y="190.0" font-size="20" font-weight="700" fill="#1c1c1e" text-anchor="middle">Inbox</text><text x="120" y="220.0" font-size="15" font-weight="500" fill="#1c1c1e" text-anchor="middle">520 emails</text><text x="120" y="252.0" font-size="14" font-weight="400" fill="#5b5b61" text-anchor="middle">with TXT, PDF,</text><text x="120" y="270.5" font-size="14" font-weight="400" fill="#5b5b61" text-anchor="middle">DOCX and XLSX</text><text x="120" y="289.0" font-size="14" font-weight="400" fill="#5b5b61" text-anchor="middle">attachments</text><rect x="225" y="150" width="245" height="196" rx="14" fill="#eaf2ff" stroke="#0a5fd6" stroke-width="2"/><text x="241" y="186.0" font-size="21" font-weight="700" fill="#0a5fd6" text-anchor="start">1  Classify</text><rect x="398.6" y="160" width="55.400000000000006" height="21" rx="10.5" fill="#0a5fd6"/><text x="426.3" y="172" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6">RULES</text><text x="241" y="216.0" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">Keyword rules sort each</text><text x="241" y="235.8" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">email: document check, SI</text><text x="241" y="255.6" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">request, invoice query,</text><text x="241" y="275.4" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">general or spam.</text><rect x="495" y="150" width="245" height="196" rx="14" fill="#eaf2ff" stroke="#0a5fd6" stroke-width="2"/><text x="511" y="186.0" font-size="21" font-weight="700" fill="#0a5fd6" text-anchor="start">2  Read</text><rect x="668.6" y="160" width="55.400000000000006" height="21" rx="10.5" fill="#0a5fd6"/><text x="696.3" y="172" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6">RULES</text><text x="511" y="216.0" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">Turns TXT, PDF, DOCX and</text><text x="511" y="235.8" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">XLSX into text. A scan or a</text><text x="511" y="255.6" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">broken file is never</text><text x="511" y="275.4" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">guessed at.</text><rect x="765" y="150" width="245" height="196" rx="14" fill="#eaf2ff" stroke="#0a5fd6" stroke-width="2"/><text x="781" y="186.0" font-size="21" font-weight="700" fill="#0a5fd6" text-anchor="start">3  Extract</text><rect x="938.6" y="160" width="55.400000000000006" height="21" rx="10.5" fill="#0a5fd6"/><text x="966.3" y="172" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6">RULES</text><text x="781" y="216.0" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">Label patterns find the 7</text><text x="781" y="235.8" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">fields under any wording.</text><text x="781" y="255.6" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">Each value keeps the exact</text><text x="781" y="275.4" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">line it came from.</text><rect x="1035" y="150" width="245" height="196" rx="14" fill="#eaf2ff" stroke="#0a5fd6" stroke-width="2"/><text x="1051" y="186.0" font-size="21" font-weight="700" fill="#0a5fd6" text-anchor="start">4  Compare</text><rect x="1208.6" y="160" width="55.400000000000006" height="21" rx="10.5" fill="#0a5fd6"/><text x="1236.3" y="172" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6">RULES</text><text x="1051" y="216.0" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">Names, ports, containers</text><text x="1051" y="235.8" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">and weights are normalised,</text><text x="1051" y="255.6" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">then compared field by</text><text x="1051" y="275.4" font-size="15" font-weight="400" fill="#1c1c1e" text-anchor="start">field.</text><text x="1051" y="316.0" font-size="13.5" font-weight="700" fill="#0a5fd6" text-anchor="start">Deterministic: the AI never</text><text x="1051" y="333.8" font-size="13.5" font-weight="700" fill="#0a5fd6" text-anchor="start">judges a match.</text><path d="M200,240 L223,240" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><path d="M470,240 L493,240" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><path d="M740,240 L763,240" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><path d="M1010,240 L1033,240" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><text x="1310" y="138.0" font-size="16" font-weight="700" fill="#5b5b61" text-anchor="start">Verdict</text><rect x="1310" y="150" width="250" height="64" rx="12" fill="#e6f6ec" stroke="#1f8a4c" stroke-width="2"/><text x="1326" y="177.0" font-size="16" font-weight="700" fill="#1f8a4c" text-anchor="start">OK</text><text x="1544" y="177.0" font-size="16" font-weight="700" fill="#1f8a4c" text-anchor="end">63</text><text x="1326" y="200.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">No mismatch detected</text><rect x="1310" y="224" width="250" height="82" rx="12" fill="#fdeaea" stroke="#c62828" stroke-width="2"/><text x="1326" y="251.0" font-size="16" font-weight="700" fill="#c62828" text-anchor="start">MISMATCH</text><text x="1544" y="251.0" font-size="16" font-weight="700" fill="#c62828" text-anchor="end">46</text><text x="1326" y="274.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">The differing fields, each with</text><text x="1326" y="291.8" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">the quoted SI and BL lines</text><rect x="1310" y="316" width="250" height="100" rx="12" fill="#fff3e0" stroke="#b85c00" stroke-width="2"/><text x="1326" y="343.0" font-size="16" font-weight="700" fill="#b85c00" text-anchor="start">NEEDS REVIEW</text><text x="1544" y="343.0" font-size="16" font-weight="700" fill="#b85c00" text-anchor="end">20</text><text x="1326" y="366.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">Wrong document, missing</text><text x="1326" y="383.8" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">attachment, unreadable scan or</text><text x="1326" y="401.6" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">blank value</text><rect x="1310" y="426" width="250" height="100" rx="12" fill="#f0f0f3" stroke="#6e6e73" stroke-width="2"/><text x="1326" y="453.0" font-size="16" font-weight="700" fill="#6e6e73" text-anchor="start">AWAITING</text><text x="1544" y="453.0" font-size="16" font-weight="700" fill="#6e6e73" text-anchor="end">91</text><text x="1326" y="476.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">Only the draft BL was</text><text x="1326" y="493.8" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">requested, so there is nothing</text><text x="1326" y="511.6" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start">to compare</text><path d="M1280,240 L1308,240" fill="none" stroke="#1c1c1e" stroke-width="2.5" marker-end='url(#h-1c1c1e)'/><text x="1310" y="546.0" font-size="12.5" font-weight="400" fill="#5b5b61" text-anchor="start">Counts: the 220 document checks in</text><text x="1310" y="562.5" font-size="12.5" font-weight="400" fill="#5b5b61" text-anchor="start">the demo inbox.</text><rect x="225" y="430" width="1055" height="160" rx="14" fill="#f5eeff" stroke="#7d3cc8" stroke-width="2" stroke-dasharray='8 6'/><text x="245" y="458.0" font-size="17" font-weight="700" fill="#7d3cc8" text-anchor="start">Gemini: optional, and off when there is no API key</text><path d="M347,430 L347,350" fill="none" stroke="#7d3cc8" stroke-width="2.5" stroke-dasharray='7 6' marker-end='url(#h-7d3cc8)'/><text x="243" y="488.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">Only when the rules are</text><text x="243" y="506.5" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">unsure, it suggests the kind</text><text x="243" y="525.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">of email. Otherwise the email</text><text x="243" y="543.4" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">is filed as General.</text><path d="M617,430 L617,350" fill="none" stroke="#7d3cc8" stroke-width="2.5" stroke-dasharray='7 6' marker-end='url(#h-7d3cc8)'/><text x="513" y="488.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">Reads a scanned page and</text><text x="513" y="506.5" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">offers a suggestion. A person</text><text x="513" y="525.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">confirms it; it is never a</text><text x="513" y="543.4" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">verdict.</text><path d="M887,430 L887,350" fill="none" stroke="#7d3cc8" stroke-width="2.5" stroke-dasharray='7 6' marker-end='url(#h-7d3cc8)'/><text x="783" y="488.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">Fills a missing field only if</text><text x="783" y="506.5" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">it quotes a line that really</text><text x="783" y="525.0" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">is in the document; otherwise</text><text x="783" y="543.4" font-size="14" font-weight="400" fill="#1c1c1e" text-anchor="start">it is ignored.</text><text x="1160" y="488.0" font-size="14" font-weight="700" fill="#7d3cc8" text-anchor="middle">Every AI answer is either</text><text x="1160" y="508.0" font-size="14" font-weight="700" fill="#7d3cc8" text-anchor="middle">checked against the</text><text x="1160" y="528.0" font-size="14" font-weight="700" fill="#7d3cc8" text-anchor="middle">document or shown to a</text><text x="1160" y="548.0" font-size="14" font-weight="700" fill="#7d3cc8" text-anchor="middle">person as a suggestion.</text><path d="M1560,366.0 L1585,366.0 L1585,620 L400,620 L400,660" fill="none" stroke="#b85c00" stroke-width="2.5" marker-end='url(#h-b85c00)'/><text x="1290" y="612.0" font-size="13.5" font-weight="700" fill="#b85c00" text-anchor="end">cases the system cannot decide wait here</text><rect x="225" y="660" width="350" height="150" rx="14" fill="#fff3e0" stroke="#b85c00" stroke-width="2"/><text x="243" y="694.0" font-size="19" font-weight="700" fill="#b85c00" text-anchor="start">Review queue</text><text x="243" y="722.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">Each case shows the reason and both</text><text x="243" y="741.1" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">documents. Nothing here is</text><text x="243" y="760.3" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">auto-approved.</text><rect x="610" y="660" width="350" height="150" rx="14" fill="#fff3e0" stroke="#b85c00" stroke-width="2"/><text x="628" y="694.0" font-size="19" font-weight="700" fill="#b85c00" text-anchor="start">A person decides</text><text x="628" y="722.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">Sees the quoted lines and any AI</text><text x="628" y="741.1" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">suggestion. Confirms or corrects the</text><text x="628" y="760.3" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">values, or marks the case resolved.</text><rect x="995" y="660" width="350" height="150" rx="14" fill="#fff3e0" stroke="#b85c00" stroke-width="2"/><text x="1013" y="694.0" font-size="19" font-weight="700" fill="#b85c00" text-anchor="start">Decision recorded</text><text x="1013" y="722.0" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">The comparison is recomputed from the</text><text x="1013" y="741.1" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">person's values and saved with a time</text><text x="1013" y="760.3" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">and a note. Undo any time. It appears in</text><text x="1013" y="779.4" font-size="14.5" font-weight="400" fill="#1c1c1e" text-anchor="start">the CSV report.</text><path d="M575,735 L608,735" fill="none" stroke="#b85c00" stroke-width="2.5" marker-end='url(#h-b85c00)'/><path d="M960,735 L993,735" fill="none" stroke="#b85c00" stroke-width="2.5" marker-end='url(#h-b85c00)'/><rect x="40" y="858" width="20" height="20" rx="4" fill="#eaf2ff" stroke="#0a5fd6" stroke-width="2"/><text x="70" y="874.0" font-size="14.5" font-weight="500" fill="#1c1c1e" text-anchor="start">Rules: deterministic and reproducible</text><rect x="400" y="858" width="20" height="20" rx="4" fill="#f5eeff" stroke="#7d3cc8" stroke-width="2" stroke-dasharray='8 6'/><text x="430" y="874.0" font-size="14.5" font-weight="500" fill="#1c1c1e" text-anchor="start">AI: optional, always checked or confirmed</text><rect x="800" y="858" width="20" height="20" rx="4" fill="#fff3e0" stroke="#b85c00" stroke-width="2"/><text x="830" y="874.0" font-size="14.5" font-weight="500" fill="#1c1c1e" text-anchor="start">A person</text><text x="1560" y="874.0" font-size="14.5" font-weight="500" fill="#5b5b61" text-anchor="end">Every value on screen links back to its source line, file and line number.</text></svg>